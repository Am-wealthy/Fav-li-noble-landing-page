    <meta charset="UTF-8" />

    <!-- Google Fonts: Unbounded, Syne, Space Grotesk -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <body class="bg-[#000000] text-slate-100 antialiased overflow-x-hidden selection:bg-cyan-500/30 selection:text-cyan-200">
    
    <!-- React App Root Container -->
    <div id="root"></div>

    <!-- Direct Form Interceptor Script for Background Routing -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        document.addEventListener('submit', function(e) {
          var form = e.target;
          if (form && form.getAttribute('data-direct-mailto') === 'true') {
            e.preventDefault();
            var name = (form.querySelector('[name="name"]') || {}).value || 'Client';
            var email = (form.querySelector('[name="email"]') || {}).value || '';
            var services = (form.querySelector('[name="services"]') || {}).value || 'Custom Tech Solution';
            var brief = (form.querySelector('[name="brief"]') || {}).value || '';

            var payload = {
              name: name,
              email: email,
              services: services,
              message: brief,
              brief: brief,
              _subject: '[Fav Li$ Noble Tech] Project Booking Request from ' + name,
              timestamp: new Date().toISOString()
            };

            fetch('https://formspree.io/f/xykronad', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify(payload)
            }).then(function(res) {
              alert('Thank you! Your project brief has been securely transmitted to Fav Li$ Noble Tech.');
            }).catch(function(err) {
              alert('Thank you! Your project brief has been securely transmitted to Fav Li$ Noble Tech.');
            });
          }
        }, true);
      });
    </script>

    <!-- Main React App Script -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Sobot Live Customer Support Integration -->
    <script>
      (function (w, d, e, x) {
          w[e] = function () {
              w.cbk = w.cbk || [];
              w.cbk.push(arguments);
          };
          x = d.createElement('script');
          x.async = true;
          x.id = 'zhichiScript';
          x.src = 'https://sobot.io';
          d.body.appendChild(x);
      })(window, document, 'zc');
    </script>
  </body>
</html>
