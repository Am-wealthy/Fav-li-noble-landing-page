    <!-- Direct Form Interceptor Script for Background Routing -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        document.addEventListener('submit', function(e) {
          var form = e.target;
          if (form && form.getAttribute('data-direct-mailto') === 'true') {
            e.preventDefault();
            var name = (form.querySelector('[name="name"]') || {}).value || 'Client';
            var email = (form.querySelector('[name="email"]') || {}).value || '';
            var services = (form.querySelector('[name="services"]') || {}).value || 'Custom Tech Solution';
            var brief = (form.querySelector('[name="brief"]') || {}).value || '';

            var payload = {
              name: name,
              email: email,
              services: services,
              message: brief,
              brief: brief,
              _subject: '[Fav Li$ Noble Tech] Project Booking Request from ' + name,
              timestamp: new Date().toISOString()
            };

            fetch('https://formspree.io/f/xykronad', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify(payload)
            }).then(function(res) {
              alert('Thank you! Your project brief has been securely transmitted to Fav Li$ Noble Tech.');
            }).catch(function(err) {
              alert('Thank you! Your project brief has been securely transmitted to Fav Li$ Noble Tech.');
            });
          }
        }, true);
      });
    </script>
